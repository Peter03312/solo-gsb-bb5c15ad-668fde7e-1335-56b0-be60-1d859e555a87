services:
  qso-service:
    build: .
    image: qso-log-attestation:1.2.0
    container_name: qso-log-attestation
    restart: unless-stopped
    ports:
      - "${QSO_PORT:-8080}:8080"
    environment:
      # 容器内监听端口
      QSO_PORT: "8080"
      # SQLite 数据库文件（挂载到命名卷持久化）
      QSO_DB_PATH: /data/qso.db
    volumes:
      - qso-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  qso-data:
